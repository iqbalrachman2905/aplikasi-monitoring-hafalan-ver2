name: Deploy to GitHub Pages

# Deploy aplikasi static (HTML + CSS + JS murni, tanpa build step)
# Folder yang di-deploy: quran-retention-app/
# URL live: https://iqbalrachman2905.github.io/aplikasi-monitoring-hafalan-ver2/

on:
  push:
    branches:
      - main
  workflow_dispatch: # tombol "Run workflow" manual dari tab Actions

# Izin minimal yang dibutuhkan untuk deploy ke Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deploy Pages berjalan dalam satu waktu
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (folder quran-retention-app)
        uses: actions/upload-pages-artifact@v3
        with:
          path: quran-retention-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
